name: Test — goidenticons

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - name: Check out goidenticons
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      # goidenticons requires no urnetwork module and carries no `replace ../`
      # directives -- only docopt and golang.org/x/image -- so unlike
      # sdk/connect/server/proxy this needs no sibling checkouts.
      - name: Build
        run: go build ./...

      # -count=1 defeats the test result cache so a green run always means the
      # tests actually ran.
      - name: Test
        run: go test -count=1 -timeout 10m -skip 'TestV2Golden' ./...

      # TestV2Golden fails on a fresh checkout on any amd64 runner, before any
      # change of ours, and it is not flaky -- it fails every time.
      #
      # The goldens under testdata/v2_golden were generated on arm64. The
      # size-100 render is the only one that resamples, through
      # draw.CatmullRom.Scale (goidenticons.go:335), and the compiler contracts
      # that float multiply-add into a single FMA instruction on arm64 but not
      # on amd64. The extra rounding step on amd64 moves one pixel by one unit:
      # urnetwork_100.png (11, 24) renders {116 210 102 255} against a golden of
      # {115 210 102 255}. The identical test binary cross-compiled with
      # GOARCH=arm64 passes on the same source, which is what pins the cause to
      # the architecture rather than to the code.
      #
      # So it is reported but not allowed to gate. The real fix belongs in the
      # repo, not here: compare with a per-channel tolerance, or rasterize at
      # the target size instead of resampling. Remove this step once that lands.
      - name: Test golden renders (architecture-dependent, non-blocking)
        continue-on-error: true
        run: go test -count=1 -timeout 10m -run 'TestV2Golden' ./...
